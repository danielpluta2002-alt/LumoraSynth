name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            configure: cmake -B build -A x64 -DLUMORA_BUILD_TESTS=OFF
            artifact: LumoraSynth-Windows
          - name: macOS
            os: macos-latest
            configure: cmake -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DLUMORA_BUILD_TESTS=OFF
            artifact: LumoraSynth-macOS
          - name: Linux
            os: ubuntu-22.04
            configure: cmake -B build -DCMAKE_BUILD_TYPE=Release
            artifact: LumoraSynth-Linux

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev \
            libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            libgl1-mesa-dev xvfb

      - name: Configure
        shell: bash
        run: ${{ matrix.configure }}

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel 4

      - name: Check macOS architectures and minimum version
        if: runner.os == 'macOS'
        run: |
          set -e
          for b in "build/LumoraSynth_artefacts/Release/VST3/Lumora Synth.vst3/Contents/MacOS/Lumora Synth" \
                   "build/LumoraSynth_artefacts/Release/AU/Lumora Synth.component/Contents/MacOS/Lumora Synth" \
                   "build/LumoraSynth_artefacts/Release/Standalone/Lumora Synth.app/Contents/MacOS/Lumora Synth"; do
            echo "$b: $(lipo -archs "$b")"
            lipo "$b" -verify_arch x86_64 arm64
            # Targets below 10.14 use LC_VERSION_MIN_MACOSX ("version"), newer ones LC_BUILD_VERSION ("minos").
            vtool -arch x86_64 -show-build "$b"
            minos=$(vtool -arch x86_64 -show-build "$b" | awk '$1 == "minos" || $1 == "version" {print $2; exit}')
            echo "  Intel minimum macOS: $minos"
            [ "$minos" = "10.13" ]
          done

      - name: Check Windows runtime dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem -Path "$vs\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe | Where-Object FullName -like "*Hostx64\x64*" | Select-Object -First 1
          $deps = & $dumpbin.FullName /DEPENDENTS "build\LumoraSynth_artefacts\Release\VST3\Lumora Synth.vst3\Contents\x86_64-win\Lumora Synth.vst3"
          $deps
          if ($deps -match "VCRUNTIME|MSVCP") { throw "Plugin still depends on the Visual C++ runtime DLLs" }

      - name: Render test
        if: runner.os == 'Linux'
        run: xvfb-run -a build/LumoraRenderTest_artefacts/Release/LumoraRenderTest

      - name: Validate with pluginval
        if: runner.os == 'Linux'
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Linux.zip
          unzip -o pluginval.zip
          xvfb-run -a ./pluginval --strictness-level 5 --validate-in-process \
            "build/LumoraSynth_artefacts/Release/VST3/Lumora Synth.vst3"

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp -R "build/LumoraSynth_artefacts/Release/VST3/Lumora Synth.vst3" dist/
          if [ -d "build/LumoraSynth_artefacts/Release/AU/Lumora Synth.component" ]; then
            cp -R "build/LumoraSynth_artefacts/Release/AU/Lumora Synth.component" dist/
          fi
          if [ -d "build/LumoraSynth_artefacts/Release/Standalone" ]; then
            cp -R build/LumoraSynth_artefacts/Release/Standalone/* dist/
          fi
          cp README.md dist/

      - name: Ad-hoc sign (macOS)
        if: runner.os == 'macOS'
        run: |
          for b in dist/*.vst3 dist/*.component dist/*.app; do
            [ -e "$b" ] && codesign --force --deep --sign - "$b"
          done

      - name: Build installer (macOS)
        if: runner.os == 'macOS'
        run: |
          version=$(sed -n 's/^project(LumoraSynth VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          echo "Version: $version"
          packaging/macos/build_pkg.sh dist "$version" LumoraSynth-macOS-Installer.pkg
          ls -la LumoraSynth-macOS-Installer.pkg

      - name: Install and validate (macOS)
        if: runner.os == 'macOS'
        run: |
          set -e
          sudo installer -pkg LumoraSynth-macOS-Installer.pkg -target /
          ls -d "/Library/Audio/Plug-Ins/VST3/Lumora Synth.vst3" \
                "/Library/Audio/Plug-Ins/Components/Lumora Synth.component" \
                "/Applications/Lumora Synth.app"
          pkgutil --pkgs | grep com.lumora.lumorasynth

          # Audio Unit: Apple's own validator.
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 3
          auval -v aumu LmS1 Lmra

          # VST3: load the installed plug-in in pluginval.
          curl -sSL -o pluginval-mac.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -oq pluginval-mac.zip
          pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --validate-in-process --skip-gui-tests \
            "/Library/Audio/Plug-Ins/VST3/Lumora Synth.vst3"

      - name: Zip
        shell: bash
        run: |
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a -tzip "../${{ matrix.artifact }}.zip" .
          else
            zip -ry "../${{ matrix.artifact }}.zip" .
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.zip
            LumoraSynth-macOS-Installer.pkg

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.artifact }}.zip
            LumoraSynth-macOS-Installer.pkg
