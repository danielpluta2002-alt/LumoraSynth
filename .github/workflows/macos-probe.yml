name: macOS runner probe

# Checks which hosted macOS runner labels currently get a machine.
on:
  push:
    branches: [main]
    paths: [".github/workflows/macos-probe.yml"]
  workflow_dispatch:

jobs:
  probe:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15, macos-15-intel, macos-26, macos-26-intel]
    steps:
      - run: |
          sw_vers
          uname -m
          xcodebuild -version
